{% extends "base.html" %}
{% block title %}Esqueci minha senha{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4 text-center">
            <i class="material-icons icon-animate" id="mail-icon">mail</i>
            <h3 class="mb-4">Esqueci minha senha</h3>
            <form method="POST" id="reset-form">
                {{ form.hidden_tag() }}
                <div class="mb-3">
                    {{ form.email.label(class="form-label") }}
                    {{ form.email(class="form-control") }}
                </div>
                <button type="submit" class="btn btn-primary w-100 mt-3">Enviar</button>
            </form>
            <div class="mt-3">
                <a href="{{ url_for('login') }}">Voltar ao login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener("DOMContentLoaded", () => {
    const form = document.getElementById("reset-form");
    const mailIcon = document.getElementById("mail-icon");

    form.addEventListener("submit", () => {
        mailIcon.classList.add("float");
        setTimeout(() => mailIcon.classList.remove("float"), 2000);
    });
});
</script>
{% endblock %}
